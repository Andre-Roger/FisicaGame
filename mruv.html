<!DOCTYPE html>
<html>
<head>
    <title>Simulador Prático de MRUV</title>
    <style>
        body { background: #222; color: #fff; font-family: sans-serif; text-align: center; }
        canvas { background: #000; border: 2px solid #555; display: block; margin: 20px auto; }

    </style>
    

</head>
<body>
    <h2>Simulador Prático de MRUV</h2>
    <p>O bloco começa parado e vai ganhando velocidade devido à aceleração constante.</p>

    

    <canvas id="cenario" width="800" height="200"></canvas>

    <label>Digite um número:</label>
    <input type="number" id = "numero">

    <button onclick="reiniciar()">Reiniciar Simulação</button>

    <label>Quantidade de obstáculos:</label>

    <select id="obstaculos">

        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>

    </select>

    <script src="../FisicaGame/mruv.js"></script>
</body>


</html>
